
services:
  wispchat-mongodb:
    image: mongo:7
    container_name: wispchat-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: wispchat
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  
  wispchat-redis:
    image: redis/redis-stack:latest
    container_name: wispchat-redis
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight Dashboard
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1
    deploy:
      resources:
        limits:
          memory: 1G

  wispchat-kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NUM_PARTITIONS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes

  wispchat-backend:
    build: ./wispchat-spring
    # image: ghcr.io/cyberminddbs/wispchat-backend:latest
    container_name: wispchat-backend
    ports:
      - "8080:8080"
    depends_on:
      - wispchat-mongodb
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: mongodb://root:secret@wispchat-mongodb:27017/wispchat?authSource=admin
      WISPCHAT_FRONTEND_URL: http://localhost:81
    volumes:
      - ./user-uploads/Files:/app/Files

  wispchat-frontend:
    build: ./wispchat-react
    # image: ghcr.io/cyberminddbs/wispchat-frontend:latest
    container_name: wispchat-frontend
    ports:
      - "81:80"
    depends_on:
      - wispchat-backend
      
volumes:
  mongo-data:
  redis-data:
